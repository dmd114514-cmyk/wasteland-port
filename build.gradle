buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net/' }
        mavenCentral()
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:3.+'
    }
}

apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'eclipse'
apply plugin: 'maven-publish'

version = '1.0.0'
group = 'dev.vanilladev.wasteland'
archivesBaseName = 'wasteland'

sourceCompatibility = targetCompatibility = compileJava.sourceCompatibility = compileJava.targetCompatibility = '1.8'

minecraft {
    mappings channel: 'snapshot', version: '20171003-1.12'

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'SCAN,REGISTRIES,REGISTRYDUMP'
            property 'forge.logging.console.level', 'debug'
        }
        server {
            property 'forge.logging.markers', 'SCAN,REGISTRIES,REGISTRYDUMP'
            property 'forge.logging.console.level', 'debug'
        }
    }
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.12.2-14.23.5.2864'
    // mixin annotations + IEarlyMixinLoader come from mixinbooter (compile-only;
    // it must be present in mods/ at runtime)
    compileOnly files('libs/mixinbooter-11.10.jar')
}

jar {
    manifest {
        attributes([
            "FMLCorePlugin": "dev.vanilladev.wasteland.core.WastelandCorePlugin",
            "FMLCorePluginContainsFMLMod": "true",
            "Specification-Title": "wasteland",
            "Specification-Vendor": "vanillaDev",
            "Specification-Version": "1.0.0",
            "Implementation-Title": "The Wasteland Mod",
            "Implementation-Version": "${version}",
            "Implementation-Vendor": "vanillaDev",
            "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

jar.finalizedBy('reobfJar')

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file:///${project.projectDir}/mcmodsrepo"
        }
    }
}

sourceSets.each {
    def dir = layout.buildDirectory.file("sourcesSets/$it.name").get().asFile
    it.output.resourcesDir = dir
    it.java.outputDir = dir
}